# ==============================================================================
# Docker Compose: Arquitectura Multi-servicio MiBici MLOps
# Orquestación de Microservicio de Inferencia (FastAPI) y Servidor MLflow
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # Servicio 1: Servidor de MLflow Tracking y Model Registry
  # ----------------------------------------------------------------------------
  mlflow:
    build:
      context: .
      dockerfile: Containerfile
    image: mibici-mlops-service:latest
    container_name: mibici-mlflow
    restart: unless-stopped
    command:
      - mlflow
      - server
      - --host
      - 0.0.0.0
      - --port
      - "5000"
      - --workers
      - "1"
      - --allowed-hosts
      - "mlflow:5000,localhost,127.0.0.1"
      - --backend-store-uri
      - sqlite:////app/mlflow.db
      - --artifacts-destination
      - /app/mlartifacts
    ports:
      - "${MLFLOW_PORT:-5000}:5000"
    environment:
      - PYTHONUNBUFFERED=1
      - MLFLOW_TRACKING_URI=sqlite:////app/mlflow.db
    volumes:
      - ./mlflow.db:/app/mlflow.db
      - ./models:/app/models
      - ./mlartifacts:/app/mlartifacts
      - mlflow-data:/mlflow
    networks:
      - mibici-net
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "${MLFLOW_CPU_LIMIT:-1.0}"
          memory: "${MLFLOW_MEMORY_LIMIT:-1G}"
        reservations:
          cpus: "0.20"
          memory: "256M"

  # ----------------------------------------------------------------------------
  # Servicio 2: API de Inferencia FastAPI (Microservicio Modelo Champion)
  # ----------------------------------------------------------------------------
  inference-api:
    build:
      context: .
      dockerfile: Containerfile
    image: mibici-mlops-service:latest
    container_name: mibici-inference-api
    restart: unless-stopped
    depends_on:
      mlflow:
        condition: service_healthy
    ports:
      - "${PORT:-8000}:8000"
    environment:
      - PORT=8000
      - MLFLOW_TRACKING_URI=${MLFLOW_TRACKING_URI:-http://mlflow:5000}
      - MODEL_ALIAS=${MODEL_ALIAS:-champion}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - PYTHONUNBUFFERED=1
    volumes:
      - ./models:/app/models:ro
    networks:
      - mibici-net
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "${API_CPU_LIMIT:-1.0}"
          memory: "${API_MEMORY_LIMIT:-1G}"
        reservations:
          cpus: "0.25"
          memory: "256M"

# ------------------------------------------------------------------------------
# Red aislada tipo bridge para comunicación DNS interna entre microservicios
# ------------------------------------------------------------------------------
networks:
  mibici-net:
    name: mibici-net
    driver: bridge

# ------------------------------------------------------------------------------
# Volúmenes persistentes para almacenamiento desacoplado del ciclo de vida
# ------------------------------------------------------------------------------
volumes:
  mlflow-data:
    name: mibici-mlflow-data
  models-data:
    name: mibici-models-data
