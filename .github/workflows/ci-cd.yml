# ==============================================================================
# GitHub Actions: Pipeline Automatizado de CI/CD para MiBici MLOps
# Automatización de Pruebas, Linters, Construcción OCI y Validación de Compose
# ==============================================================================

name: CI/CD Pipeline - MiBici MLOps

"on":
  push:
    branches:
      - main
      - develop
      - "feat/**"
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_NAME: "mibici-inference-api"
  PYTHON_DEFAULT: "3.10"

jobs:
  # ----------------------------------------------------------------------------
  # Job 1: Verificación Estática de Código y Seguridad
  # ----------------------------------------------------------------------------
  lint-and-security:
    name: Lint & Security Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código fuente
        uses: actions/checkout@v4

      - name: Configurar entorno Python ${{ env.PYTHON_DEFAULT }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_DEFAULT }}
          cache: "pip"

      - name: Instalar herramientas de linters y seguridad
        run: |
          python -m pip install --upgrade pip
          python -m pip install "ruff==0.17.1" "bandit==1.9.4"

      - name: Ejecutar verificación de estilo y formato con Ruff
        run: |
          ruff check .
          ruff format --check .

      - name: Ejecutar análisis de seguridad estática AST con Bandit
        run: |
          bandit -r mibici_mlops -ll

  # ----------------------------------------------------------------------------
  # Job 2: Suite Completa de Pruebas Automatizadas con Matriz y Caché
  # ----------------------------------------------------------------------------
  test-suite:
    name: Test Suite (Python ${{ matrix.python-version }})
    needs: [lint-and-security]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10"]
    steps:
      - name: Checkout del código fuente
        uses: actions/checkout@v4

      - name: Configurar Python ${{ matrix.python-version }} con caché
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Cache de dependencias pip avanzado
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('requirements.txt', 'pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ matrix.python-version }}-
            ${{ runner.os }}-pip-

      - name: Instalar dependencias del proyecto
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Ejecutar pruebas automatizadas con reporte de cobertura
        run: |
          pytest --cov=mibici_mlops --cov-report=xml:coverage.xml --cov-report=term-missing tests/

      - name: Subir reporte de cobertura como artefacto
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report-py${{ matrix.python-version }}
          path: coverage.xml
          retention-days: 7

  # ----------------------------------------------------------------------------
  # Job 3: Construcción de Contenedor y Validación de Docker Compose
  # ----------------------------------------------------------------------------
  docker-build-and-validate:
    name: Container Build & Compose Validation
    needs: [test-suite]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código fuente
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx con soporte de caché
        uses: docker/setup-buildx-action@v3

      - name: Validar sintaxis y configuración de Docker Compose
        run: |
          docker compose config

      - name: Construir imagen de contenedor OCI desde Containerfile
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Containerfile
          load: true
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }},mibici-mlops-service:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Validación de levantamiento y Smoke Test con Docker Compose
        run: |
          # Levantar los servicios en segundo plano usando la imagen construida
          docker compose up -d

          # Esperar a que los healthchecks alcancen estado saludable
          echo "Esperando que los servicios alcancen estado saludable..."
          for i in {1..30}; do
            if docker compose ps | grep -q "healthy"; then
              echo "Servicios saludables detectados."
              break
            fi
            sleep 2
          done

          docker compose ps

          # Probar endpoint de salud de MLflow
          curl --fail --retry 5 --retry-delay 2 http://localhost:5000/health || exit 1

          # Probar endpoint de salud de FastAPI
          curl --fail --retry 5 --retry-delay 2 http://localhost:8000/health || exit 1

          # Smoke test: Probar endpoint de inferencia POST /predict
          curl --fail -X POST http://localhost:8000/predict \
            -H "Content-Type: application/json" \
            -d '{"station_id": "2", "hour_of_day": 8, "day_of_week": 1, "is_weekend": 0, "month": 5, "lag_1": 4.0, "lag_24": 5.0, "lag_168": 6.0, "rolling_mean_3h": 4.5, "rolling_mean_24h": 5.2, "history_hours": 120}' || exit 1

          echo "Smoke test completado exitosamente."

      - name: Desmontaje limpio de servicios Compose
        if: always()
        run: |
          docker compose down -v
